name: MailShield CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-and-ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scikit-learn pandas numpy scipy joblib fastapi uvicorn pydantic pydantic-settings sqlalchemy python-multipart pyjwt bcrypt httpx pytest pytest-asyncio ruff

      - name: Run Ruff Linting
        run: |
          ruff check backend ml

      - name: Train ML Models & Serialize Artifacts
        run: |
          python scripts/generate_seed_corpus.py
          PYTHONPATH=ml/src python ml/src/mailshield_ml/pipeline.py

      - name: Run Pytest Test Suite
        run: |
          pytest -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Web Dependencies
        run: npm --prefix apps/web install

      - name: Run Vitest Unit Tests
        run: npm --prefix apps/web test

      - name: Build Web Production Bundle
        run: npm --prefix apps/web run build

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Desktop Dependencies
        run: npm --prefix apps/desktop install

      - name: Build Desktop TypeScript
        run: npm --prefix apps/desktop run build
