[project]
name = "mailshield"
version = "2.1.0"
description = "Explainable Spam Classification Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Priya Kumari", email = "priya06.18kumari@gmail.com" },
  { name = "Anurag Tiwari", email = "anurag18.05tiwari@gmail.com" }
]
maintainers = [
  { name = "Priya Kumari", email = "priya06.18kumari@gmail.com" },
  { name = "Anurag Tiwari", email = "anurag18.05tiwari@gmail.com" }
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
pythonpath = [".", "ml/src"]
testpaths = ["ml/tests", "backend/tests"]
